daemon off;

error_log /dev/stdout info;

events {
  worker_connections 1024;
}

rtmp {
  server {
    listen ${RTMP_PORT};
    chunk_size 4096;

    # Ingest from API FFmpeg (already H.264/AAC FLV) and segment to HLS.
    # Push URL: rtmp://rtmp:1935/live/{sessionId}
    application live {
      live on;
      record off;
      drop_idle_publisher 10s;

      hls on;
      hls_path /opt/data/hls;
      hls_fragment 2;
      hls_playlist_length 10;
      hls_nested on;
      hls_cleanup on;
      hls_continuous on;
    }
  }
}

http {
  sendfile off;
  tcp_nopush on;
  server_tokens off;
  access_log /dev/stdout combined;

  server {
    listen ${HTTP_PORT};

    # Nested playlists: /live/{sessionId}/index.m3u8
    location /live {
      alias /opt/data/hls;
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;
    }
  }
}
